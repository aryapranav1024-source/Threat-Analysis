version: '3.8'

services:
  configsvr:
    image: mongo:7.0
    container_name: lab11_configsvr
    command: mongod --configsvr --replSet configReplSet --port 27019 --bind_ip_all
    ports:
      - "27019:27019"
    volumes:
      - configdata:/data/configdb

  shard1:
    image: mongo:7.0
    container_name: lab11_shard1
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018 --bind_ip_all
    ports:
      - "27018:27018"
    volumes:
      - shard1data:/data/db

  shard2:
    image: mongo:7.0
    container_name: lab11_shard2
    command: mongod --shardsvr --replSet shard2ReplSet --port 27020 --bind_ip_all
    ports:
      - "27020:27020"
    volumes:
      - shard2data:/data/db

  mongos:
    image: mongo:7.0
    container_name: lab11_mongos
    depends_on:
      - configsvr
      - shard1
      - shard2
    command: mongos --configdb configReplSet/configsvr:27019 --port 27017 --bind_ip_all
    ports:
      - "27017:27017"

  lab_runner:
    build: .
    container_name: lab11_demo_runner
    depends_on:
      - mongos
    environment:
      - MONGO_URI=mongodb://mongos:27017/
    command: python3 /app/demo_menu.py

volumes:
  configdata:
  shard1data:
  shard2data:
